[package]
name = "comphwde"
description = "HWDE Wayland/XWayland compositor (Smithay-based), extended with --extern-sde, --extern-hacker-mode."
version = "0.0.1"
edition = "2021"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/HackerOS-Linux-System/HWDE/"
rust-version = "1.80"

[[bin]]
name = "comphwde"
path = "src/main.rs"

[dependencies]
hwde-ipc = { path = "sde/ipc" }
# Own-from-scratch protocol used only in `--extern-sde` mode (see
# src/extern_ipc.rs and the sde-ipc crate's module docs). Independent of
# hwde-ipc on purpose - SDE is a native Slint shell, not a Tauri webview.
sde-ipc = { path = "sde/sde-ipc" }
anyhow = "1"
bitflags = "2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
xkbcommon = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses/writes ~/.config/HWDE/compositor.toml (see src/config.rs) - the
# same file the shell's "Skróty klawiszowe" settings section reads/writes
# (source-code/backend/src-tauri/src/commands/keybindings.rs).
toml = "0.8"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "desktop",
    "wayland_frontend",
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "renderer_gl",
    "use_system_lib",
    "xwayland",
    "x11rb_event_source",
]

[dependencies.x11rb]
version = "0.13"
default-features = false
features = ["composite"]

[features]
default = ["xwayland"]
# XWayland (Xorg compatibility) support - required for HackerOS's many
# X11-only security/pentesting/gaming tools that don't speak Wayland yet.
xwayland = []
# Real (not just planned) DRM/udev/libseat/libinput backend for driving a
# display from a bare TTY/SDDM login - see `backend_drm.rs`'s module doc
# for exactly which parts are solid (session/device-discovery/input) vs.
# still need hardware-in-the-loop iteration (the atomic KMS modeset +
# render/pageflip core). Off by default; NOT wired into `main` yet.
drm-experimental = [
    "smithay/backend_udev",
    "smithay/backend_session",
    "smithay/backend_session_libseat",
    "smithay/backend_libinput",
    "smithay/backend_gbm",
    "smithay/renderer_multi",
]

# This manifest is both `comphwde`'s own [package] *and* the workspace
# root - a "mixed manifest", one of the two ways Cargo lets a root
# crate's Cargo.toml double as its workspace's. `comphwde` itself is an
# implicit workspace member (it's the package defined right here);
# `members` below only needs to list the two path-dependency crates that
# live under `sde/`, which otherwise wouldn't be part of the workspace at
# all.
[workspace]
resolver = "2"
members = [
    "sde/ipc",
    "sde/sde-ipc",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 0
