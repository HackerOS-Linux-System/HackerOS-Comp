[package]
name = "comphwde"
description = "HWDE Wayland/XWayland compositor (Smithay-based), extended with --extern-sde, --extern-hacker-mode."
version = "0.0.1"
edition = "2021"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/HackerOS-Linux-System/comphwde/"
rust-version = "1.80"

[[bin]]
name = "comphwde"
path = "src/main.rs"

[dependencies]
hwde-ipc = { path = "sde" }
# Own-from-scratch protocol used only in `--extern-<name>` mode (see
# src/extern_ipc.rs and the sde-ipc crate's module docs). Independent of
# hwde-ipc on purpose - SDE is a native Slint shell, not a Tauri webview.
# Every `--extern-<name>` target (sde, hacker-mode, ...) speaks this same
# wire protocol on its own socket; only the socket name differs (see
# `sde_ipc::socket_path_for`). See `hacker-mode/` in this same workspace
# for that target's own reference copy of the client side of this
# protocol - the `[[bin]] comphwde` built from THIS package does not
# depend on it (`extern_ipc.rs` only implements the *server* side,
# generically, for any `--extern-<name>`); it's a workspace-local sibling
# crate, not something this binary links against. See
# `hacker-mode/src/lib.rs`'s module docs for why Hacker Mode's actually
# shipped binaries use their own, separately-vendored copy of it instead
# of depending on this one.
sde-ipc = { path = "sde/ipc" }
# HackerLand: comphwde's own window manager identity/protocol, exposed as
# the `comphwde wm` subcommand - see wm/Cargo.toml's description (the
# crate is named `hackerland`; it lives in this repo's `wm/` directory).
# main.rs calls `hackerland::run()` for the CLI-client half
# (`comphwde wm <subcommand>`); `src/hackerland_ipc.rs` is the server half
# and depends on this crate too, for the shared wire-protocol types.
hackerland = { path = "wm" }
anyhow = "1"
bitflags = "2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
xkbcommon = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses/writes ~/.config/HWDE/compositor.toml (see src/config.rs) - the
# same file the shell's "Skróty klawiszowe" settings section reads/writes
# (source-code/backend/src-tauri/src/commands/keybindings.rs).
toml = "0.8"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "desktop",
    "wayland_frontend",
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "renderer_gl",
    "use_system_lib",
    "xwayland",
    "x11rb_event_source",
]

[dependencies.x11rb]
version = "0.13"
default-features = false
features = ["composite"]

[features]
default = ["xwayland", "drm-experimental"]
# XWayland (Xorg compatibility) support - required for HackerOS's many
# X11-only security/pentesting/gaming tools that don't speak Wayland yet.
xwayland = []
# Real DRM/udev/libseat/libinput backend for driving a display from a bare
# TTY/SDDM login - see `backend_drm.rs`'s module doc. On by default (part
# of `default` above) so a plain `cargo build --release` always includes
# it; `main.rs` still only *activates* it at runtime when there's no
# WAYLAND_DISPLAY/DISPLAY to nest inside of, so a normal desktop dev build
# is unaffected either way. Disable explicitly with
# `--no-default-features --features xwayland` if you need a build that
# can't touch /dev/dri at all (e.g. a container without a DRM device).
drm-experimental = [
    "smithay/backend_udev",
    "smithay/backend_session",
    "smithay/backend_session_libseat",
    "smithay/backend_libinput",
    "smithay/backend_gbm",
    "smithay/renderer_multi",
]

# This manifest is both `comphwde`'s own [package] *and* the workspace
# root - a "mixed manifest", one of the two ways Cargo lets a root
# crate's Cargo.toml double as its workspace's. `comphwde` itself is an
# implicit workspace member (it's the package defined right here);
# `members` below lists every other path-dependency crate that lives in
# this repository (`sde/` + `sde/ipc`, `hacker-mode/`'s workspace-local
# reference copy, and `wm/` for the `comphwde wm` subcommand), which
# otherwise wouldn't be part of the workspace at all.
[workspace]
resolver = "2"
members = [
    "sde",
    "sde/ipc",
    "hacker-mode",
    "wm",
    "cybersecurity-mode",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 0
