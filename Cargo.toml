[package]
name = "comphwde"
description = "HWDE Wayland/XWayland compositor (Smithay-based)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "comphwde"
path = "src/main.rs"

[dependencies]
hwde-ipc = { path = "../ipc" }
anyhow = "1"
bitflags = "2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
xkbcommon = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses/writes ~/.config/HWDE/compositor.toml (see src/config.rs) - the
# same file the shell's "Skróty klawiszowe" settings section reads/writes
# (source-code/backend/src-tauri/src/commands/keybindings.rs).
toml = "0.8"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "desktop",
    "wayland_frontend",
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "renderer_gl",
    "use_system_lib",
    "xwayland",
    "x11rb_event_source",
]

[dependencies.x11rb]
version = "0.13"
default-features = false
features = ["composite"]

[features]
default = ["xwayland"]
# XWayland (Xorg compatibility) support - required for HackerOS's many
# X11-only security/pentesting/gaming tools that don't speak Wayland yet.
xwayland = []
# Real (not just planned) DRM/udev/libseat/libinput backend for driving a
# display from a bare TTY/SDDM login - see `backend_drm.rs`'s module doc
# for exactly which parts are solid (session/device-discovery/input) vs.
# still need hardware-in-the-loop iteration (the atomic KMS modeset +
# render/pageflip core). Off by default; NOT wired into `main` yet.
drm-experimental = [
    "smithay/backend_udev",
    "smithay/backend_session",
    "smithay/backend_session_libseat",
    "smithay/backend_libinput",
    "smithay/backend_gbm",
    "smithay/renderer_multi",
]
