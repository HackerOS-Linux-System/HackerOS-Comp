[package]
name = "comphwde"
description = "HWDE Wayland/XWayland compositor (Smithay-based), extended with --extern-sde (wlr-foreign-toplevel-management), --extern-hacker-mode, --extern-cybersecurity-mode (sde-ipc)."
version = "0.0.1"
edition = "2021"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/HackerOS-Linux-System/HWDE/"
rust-version = "1.80"

[[bin]]
name = "comphwde"
path = "src/main.rs"

[dependencies]
# Raw getsockopt(SO_PEERCRED) for `extern_ipc.rs`'s pid lookup - std's
# `UnixStream::peer_cred()` is still gated behind the unstable
# `peer_credentials_unix_socket` feature (confirmed by this project's
# first real compile: E0658), so this goes straight to libc instead. A
# thin, extremely stable FFI surface (`getsockopt`, `SOL_SOCKET`,
# `SO_PEERCRED`, the `ucred` struct layout) that's been unchanged for
# many years - much lower risk than depending on an unstable std feature
# or guessing at a higher-level crate's version-specific API.
libc = "0.2"
hwde-ipc = { path = "hwde-ipc" }
# Own-from-scratch protocol used only in `--extern-<name>` mode for every
# target except `--extern-sde` (see src/extern_ipc.rs and src/main.rs's
# module doc, and this crate's own module docs - `--extern-sde` itself
# now speaks `wlr-foreign-toplevel-management-unstable-v1` instead, see
# src/foreign_toplevel.rs). Independent of hwde-ipc on purpose - SDE is a
# native Slint shell, not a Tauri webview. Every remaining
# `--extern-<name>` target (hacker-mode, cybersecurity-mode, ...) speaks
# this same wire protocol on its own socket; only the socket name differs
# (see `sde_ipc::socket_path_for`). See `hacker-mode/` and
# `cybersecurity-mode/` in this same workspace for those targets' own
# reference copies of the client side of this protocol - the
# `[[bin]] comphwde` built from THIS package does not depend on either of
# them (`extern_ipc.rs` only implements the *server* side, generically,
# for any `--extern-<name>` that isn't `sde`); they are workspace-local
# sibling crates, not something this binary links against. See
# `hacker-mode/src/lib.rs`'s and `cybersecurity-mode/src/lib.rs`'s module
# docs for why Hacker Mode's (and, eventually, Cybersecurity Mode's)
# actually shipped binaries use their own, separately-vendored copies of
# it instead of depending on these workspace-local ones.
sde-ipc = { path = "sde" }
# HackerLand: comphwde's own window manager identity/protocol, exposed as
# the `comphwde wm` subcommand - see wm/Cargo.toml's description (the
# crate is named `hackerland`; it lives in this repo's `wm/` directory).
# main.rs calls `hackerland::run()` for the CLI-client half
# (`comphwde wm <subcommand>`); `src/hackerland_ipc.rs` is the server half
# and depends on this crate too, for the shared wire-protocol types.
hackerland = { path = "wm" }
anyhow = "1"
bitflags = "2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
xkbcommon = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses/writes ~/.config/HWDE/compositor.toml (see src/config.rs) - the
# same file the shell's "Skróty klawiszowe" settings section reads/writes
# (source-code/backend/src-tauri/src/commands/keybindings.rs).
toml = "0.8"
# Pure-Rust font rasterizer for SSD window title text - see
# src/title_text.rs's module doc for why this crate specifically (no
# system font-library linkage, i.e. no fontconfig/freetype dependency)
# and what's/isn't verified about the exact API surface used.
fontdue = "0.8"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "desktop",
    "wayland_frontend",
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "renderer_gl",
    "use_system_lib",
    "xwayland",
    "x11rb_event_source",
]

[dependencies.x11rb]
version = "0.13"
default-features = false
features = ["composite"]

[features]
default = ["xwayland", "drm-experimental"]
# XWayland (Xorg compatibility) support - required for HackerOS's many
# X11-only security/pentesting/gaming tools that don't speak Wayland yet.
xwayland = []
# Real DRM/udev/libseat/libinput backend for driving a display from a bare
# TTY/SDDM login - see `backend_drm.rs`'s module doc. On by default (part
# of `default` above) so a plain `cargo build --release` always includes
# it; `main.rs` still only *activates* it at runtime when there's no
# WAYLAND_DISPLAY/DISPLAY to nest inside of, so a normal desktop dev build
# is unaffected either way. Disable explicitly with
# `--no-default-features --features xwayland` if you need a build that
# can't touch /dev/dri at all (e.g. a container without a DRM device).
drm-experimental = [
    "smithay/backend_udev",
    "smithay/backend_session",
    "smithay/backend_session_libseat",
    "smithay/backend_libinput",
    "smithay/backend_gbm",
    "smithay/renderer_multi",
]

# This manifest is both `comphwde`'s own [package] *and* the workspace
# root - a "mixed manifest", one of the two ways Cargo lets a root
# crate's Cargo.toml double as its workspace's. `comphwde` itself is an
# implicit workspace member (it's the package defined right here);
# `members` below lists every other path-dependency crate that lives in
# this repository (`hwde-ipc/` + `sde-ipc/`, `hacker-mode/`'s and
# `cybersecurity-mode/`'s workspace-local reference copies, and `wm/` for
# the `comphwde wm` subcommand), which otherwise wouldn't be part of the
# workspace at all.
[workspace]
resolver = "2"
members = [
    "hwde-ipc",
    "sde",
    "hacker-mode",
    "cybersecurity-mode",
    "wm",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 0
