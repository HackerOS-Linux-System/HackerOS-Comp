[package]
name = "sde-ipc"
version = "0.1.0"
edition = "2021"
description = "Standalone IPC protocol between comphwde (running with --extern-sde) and SDE, the Slint-based desktop environment. Deliberately independent from hwde-ipc: SDE is a native Slint shell, not a Tauri webview, so it gets its own wire protocol rather than reusing HWDE's."
license = "GPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
